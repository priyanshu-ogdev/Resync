name: Feature request
description: Propose something new
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: If this touches a core design decision rather than an implementation detail, consider
        opening it as a draft ADR instead (docs/adr/0000-template.md) — see CONTRIBUTING.md.
    validations:
      required: true
