name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          enable-cache: true
      - run: uv sync --extra server --extra cli --group dev
      - name: Full test suite against the built artifact, not just source
        run: |
          uv build
          uv run pytest tests/
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/resync-mcp  # confirm the final distribution name before first release — docs/tech-stack.md
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC) — no stored token, see docs/release-plan.md
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
