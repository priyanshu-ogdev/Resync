name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --extra server --extra cli --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --extra server --extra cli --group dev
      - name: Install ast-grep binary (used by real, non-mocked integration tests)
        run: pip install ast-grep-cli
      - name: Unit and property-based tests
        run: uv run pytest tests/unit --cov=resync --cov-report=xml
      - name: Integration tests
        run: uv run pytest tests/integration
      # Coverage floors per docs/architecture.md#7-testing-strategy--quality-pyramid: 100% on verification/ and config/knowledge schemas,
      # 80% floor everywhere else. Enforced here once the corresponding modules have real implementations
      # to measure — see docs/implementation-plan.md for phase sequencing.

  demo-regression:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --extra server --extra cli --group dev
      - name: Flagship demo scenario (peft/bitsandbytes fixture)
        run: uv run pytest tests/integration/test_flagship_demo.py -v
        # See docs/architecture.md#8-release--publishing-strategy — this is the same script rehearsed for the actual demo,
        # automated so it can't silently regress between commits.
