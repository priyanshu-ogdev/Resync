# resync.toml — Resync's own configuration, dogfooding the format it ships.
# Full field reference: docs/architecture.md#resynctoml-the-compatibility-contract

[project]
mode = "hybrid"              # realtime | scheduled | hybrid
target_profile = "pinned"    # latest | pinned | security-only | "YYYY-MM" (date-based)
agents = ["claude-code", "opencode", "antigravity"]

[schedule]
mechanical = "daily"
semantic = "weekly"
critical_cve = "instant"

[confidence]
auto_apply_above = 0.95
review_required_below = 0.95

# Explicit pins: versions or symbols the tool must never touch, and must never
# flag as a bug when it encounters them.
[[pin]]
package = "torch"
max_version = "2.1.0"
reason = "CUDA 11.8 hardware constraint on the reference demo environment — INFRA-482"

# File/symbol-level exceptions for deliberately frozen legacy code.
# `expires` forces a re-review instead of letting a pin become permanent tech debt.
[[exception]]
path = "src/legacy/adapter.py::old_lora_merge"
reason = "intentionally frozen, see docs/architecture.md#decision-5-resynctoml-as-the-single-source-of-truth or ADR-014 in your own tracker"
expires = "2027-01-01"

# Persisted sync-vs-shift decisions from the Impact Map (docs/architecture.md#the-impact-map).
# Set once by a human via the MCP input_required flow, reused for matching future cases.
[[policy]]
symbol = "peft.PeftModel.from_pretrained"
change_type = "param_split"
decision = "shift"
confirmed_by = "user"
last_confirmed = "2026-09-01"
